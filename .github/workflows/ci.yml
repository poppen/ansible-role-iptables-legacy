---
name: CI
on:
  push:
    branches:
      - "main"
  pull_request:

defaults:
  run:
    working-directory: "poppen.iptables_legacy"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4
        with:
          path: "poppen.iptables_legacy"

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install test dependencies.
        run: pip3 install yamllint ansible-lint

      - name: Run lints.
        run: |
          yamllint .
          ansible-lint

  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: ubuntu2204
          - distro: debian11
          - distro: debian10
          # Ubuntu 20.04 ships Python 3.8 and ansible-core 2.20 raised the
          # minimum target version to 3.9, so pin this leg to the last release
          # series that can still manage focal.
          - distro: ubuntu2004
            ansible: "<13"

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4
        with:
          path: "poppen.iptables_legacy"

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install test dependencies.
        run: |
          pip3 install "ansible${{ matrix.ansible }}" molecule molecule-plugins[docker] docker

      - name: Run Molecule tests.
        run: molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_DISTRO: ${{ matrix.distro }}
          NO_IPV6: "1"
